<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141517" />
      <stop offset="100%" stop-color="#070809" />
    </linearGradient>

    <linearGradient id="goldCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7432" />
      <stop offset="15%" stop-color="#CBA358" />
      <stop offset="50%" stop-color="#F7E5A9" />
      <stop offset="65%" stop-color="#D8B467" />
      <stop offset="100%" stop-color="#9A7432" />
    </linearGradient>

    <linearGradient id="chromeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" />

  <g opacity="0.15" stroke="url(#goldCore)" stroke-width="1" fill="none">
    <rect x="30" y="30" width="540" height="390" rx="8" />
    <line x1="60" y1="30" x2="60" y2="420" />
    <line x1="540" y1="30" x2="540" y2="420" />
  </g>

  <g transform="translate(10, 5)">
    
    <path d="M 110,120 L 145,120 L 145,320 L 110,320 Z" fill="url(#goldCore)" />
    
    <path d="M 235,120 L 270,120 L 270,320 L 235,320 Z" fill="url(#goldCore)" />
    
    <path d="M 145,120 L 190,250 L 190,295 L 145,165 Z" fill="url(#goldCore)" opacity="0.9"/>
    
    <path d="M 235,120 L 190,250 L 190,295 L 235,165 Z" fill="url(#chromeAccent)" filter="url(#shadow)" />


    <path d="M 290,120 L 325,120 L 325,320 L 290,320 Z" fill="url(#goldCore)" />
    
    <path d="M 325,120 
             C 385,120 405,165 405,205 
             C 405,245 380,255 325,255 
             L 325,223 
             C 360,223 372,215 372,205 
             C 372,190 355,152 325,152 
             Z" 
          fill="url(#chromeAccent)" filter="url(#shadow)" />
          
    <path d="M 325,255 L 360,255 L 415,320 L 375,320 Z" fill="url(#goldCore)" />


    <path d="M 435,120 L 470,120 L 470,320 L 435,320 Z" fill="url(#chromeAccent)" />
    
    <path d="M 470,245 L 535,120 L 495,120 L 445,215 Z" fill="url(#goldCore)" />
    
    <path d="M 460,230 L 470,210 L 545,320 L 505,320 Z" fill="url(#goldCore)" filter="url(#shadow)" />

  </g>

  <text x="300" y="390" 
        fill="#8E9AA8" 
        font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="9" 
        text-anchor="middle" 
        opacity="0.7">STUDIO DESIGN</text>
</svg>
